name: Personal Edition macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/personal-edition-macos.yml"
      - "personal-edition/**"
      - "scripts/verify_personal_edition_macos.sh"
      - "services/personal_edition_delivery.py"
      - "static/**"
      - "templates/**"
      - "tests/test_personal_acg_pwa.py"
      - "tests/test_personal_edition_activation.py"
      - "tests/test_personal_edition_macos_ci.py"
  push:
    paths:
      - ".github/workflows/personal-edition-macos.yml"
      - "personal-edition/**"
      - "scripts/verify_personal_edition_macos.sh"
      - "services/personal_edition_delivery.py"
      - "static/**"
      - "templates/**"
      - "tests/test_personal_acg_pwa.py"
      - "tests/test_personal_edition_activation.py"
      - "tests/test_personal_edition_macos_ci.py"

permissions:
  contents: read

concurrency:
  group: personal-edition-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-personal-edition:
    name: Build and launch on macOS 15
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx==0.27.2

      - name: Build Personal Edition templates
        run: python personal-edition/build.py

      - name: Verify ZIP permissions and Mac launchers
        run: bash scripts/verify_personal_edition_macos.sh

      - name: Verify personalized ACG delivery
        run: >-
          python -m pytest
          tests/test_personal_edition_activation.py::test_acg_bundle_zip_contains_precomputed_lines_and_local_map
          tests/test_personal_acg_pwa.py
          tests/test_personal_edition_macos_ci.py
          -q
