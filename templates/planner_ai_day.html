<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ ui.lead }}">
  <title>{{ ui.title }}</title>
  <style>
    :root{--navy:#0b1633;--gold:#c6a46b;--ivory:#fcfaf7;--ink:#252b3d}
    *{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    main{max-width:850px;margin:32px auto;padding:28px;background:var(--ivory);border:1px solid var(--gold);border-radius:16px}
    .eyebrow{color:#846b3f;letter-spacing:.16em;font-size:.75rem;text-transform:uppercase}
    h1{font-family:Georgia,"Noto Serif JP",serif;margin:.35em 0}.lead{line-height:1.8;color:#596071}
    textarea{width:100%;min-height:360px;padding:16px;border:1px solid #d9d1c3;border-radius:10px;background:#fff;font:13px/1.55 ui-monospace,monospace}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
    button,a.button{border:0;border-radius:999px;padding:12px 18px;font-weight:700;text-decoration:none;cursor:pointer}
    button{background:var(--navy);color:#fff}.button{background:#eee2cd;color:var(--navy)}
    #status{min-height:1.5em;color:#496a4b}.note{font-size:.82rem;line-height:1.65;color:#697080}
    @media(max-width:640px){main{margin:0;min-height:100vh;border-radius:0;padding:22px 16px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">Nanami Astro · {{ target_date }}</div>
  <h1>{{ ui.title }}</h1>
  <p class="lead">{{ ui.lead }}</p>
  <div class="actions">
    <button type="button" id="copy">{{ ui.copy_button }}</button>
    <a class="button" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>
    <a class="button" href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a>
    <a class="button" href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini</a>
  </div>
  <div id="status" aria-live="polite"></div>
  <textarea id="prompt" readonly>{{ prompt_text }}</textarea>
  <p class="note">{{ ui.safety_note }}</p>
</main>
<script>
document.getElementById('copy').addEventListener('click', async () => {
  const text = document.getElementById('prompt').value;
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const el=document.getElementById('prompt'); el.select(); document.execCommand('copy'); }
  document.getElementById('status').textContent = {{ ui.copied | tojson }};
});
</script></body></html>
