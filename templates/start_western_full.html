<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホロスコープFULL版 | AI鑑定データ作成</title>
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
  <!-- asset_version: {{ asset_version }} -->
</head>
<body>
  <main class="wrap">
    <div class="card buyer-card product-western_full">
      <p class="eyebrow">nanami-products</p>
      <div class="product-pill">ホロスコープFULL版</div>
      <h1>ホロスコープFULL版<br>鑑定データ作成</h1>
      <p class="lead">小惑星・トランジット（1ヶ月）を含む、FULL版の出生図データを作成します。<br>注文番号と出生情報を入力してください。</p>
      <section class="notice-box warn">
        <h2>登録前に必ず確認してください</h2>
        <ul class="plain-list">
          <li><strong>注文番号は1回だけ使用できます。</strong>一度生成すると再生成できません。</li>
          <li><strong>送信後の入力変更はできません。</strong>生年月日・出生時刻・出生地をよく確認してください。</li>
          <li>出生時刻が不明な場合は空欄のままで構いません（正午で計算します）。</li>
          <li>生成後に表示されるURLは、必ず保存してください。</li>
        </ul>
      </section>
      <div class="action-area">
        <a href="{{ redeem_url }}" class="primary-link">入力フォームへ進む</a>
      </div>
    </div>
  </main>
</body>
</html>
