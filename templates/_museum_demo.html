<!-- Birth Chart Museum Demo overlay — demo ルートのみで include される。
     Personal Edition build は {% raw %}{% if demo %}{% endraw %} ブロックごと除去する。 -->
<style>
  .ht-demo-ribbon {
    /* HUD 上部のツアー操作（← 前 / 次へ →）と重ならないよう下部中央に置く。
       下部バーの中央は空領域、キャプションは bottom:88px なので干渉しない。 */
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 14px;
    border-radius: 999px;
    background: rgba(10, 17, 40, 0.82);
    border: 1px solid rgba(240, 220, 160, 0.45);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #f3ecd8;
    white-space: nowrap;
  }
  .ht-demo-ribbon .ht-demo-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #e8c96a;
    box-shadow: 0 0 8px rgba(232, 201, 106, 0.9);
    flex: none;
  }
  .ht-demo-ribbon button {
    font: inherit;
    letter-spacing: 0.04em;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid rgba(232, 201, 106, 0.8);
    background: rgba(232, 201, 106, 0.16);
    color: #f6e7b8;
    cursor: pointer;
  }
  .ht-demo-ribbon button:hover {
    background: rgba(232, 201, 106, 0.3);
  }
  #ht-demo-overlay .ht-overlay-card p {
    margin: 0 0 10px;
    font-size: 13px;
    line-height: 1.8;
    color: rgba(243, 236, 216, 0.92);
  }
  @media (max-width: 640px) {
    .ht-demo-ribbon {
      bottom: 84px;
      max-width: calc(100vw - 16px);
      white-space: normal;
    }
  }
</style>

<div class="ht-demo-ribbon" id="ht-demo-ribbon" role="note">
  <span class="ht-demo-dot" aria-hidden="true"></span>
  <span id="ht-demo-ribbon-text">Preview — Chief Editor Neko</span>
  <button type="button" id="ht-demo-cta">Free app</button>
</div>

<div id="ht-demo-overlay" class="ht-overlay-panel" hidden>
  <div class="ht-overlay-card">
    <h3 id="ht-demo-title">Use the free app with your chart</h3>
    <p id="ht-demo-copy1">You're exploring Chief Editor Neko's sample birth chart.</p>
    <p id="ht-demo-copy2">Download the separate free app, then paste your astrology YAML at the entrance. Windows &amp; macOS; no purchase or account is required.</p>
    <div class="ht-menu-actions" id="ht-demo-actions"></div>
    <p class="ht-overlay-note" id="ht-demo-note">This demo never asks for your birth data.</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var STR = {
    en: {
      ribbon: "Preview — Chief Editor Neko",
      cta: "Free app",
      title: "Use the free app with your chart",
      copy1: "You’re exploring Chief Editor Neko’s sample birth chart.",
      copy2: "Download the separate free app, then paste your astrology YAML at the entrance. Windows & macOS; no purchase or account is required.",
      download: "Download the free Museum + Dream Sky",
      close: "Back to the demo",
      note: "This demo never asks for your birth data. Keep any YAML you use in the downloaded app private."
    },
    ja: {
      ribbon: "サンプル出生図（無料デモ）",
      cta: "無料版アプリ",
      title: "無料版アプリで自分の出生図を見る",
      copy1: "いま表示されているのはサンプル出生図（ねこ編集長）です。",
      copy2: "別配布の無料版アプリをダウンロードし、入口で占術データYAMLを貼り付けると、自分の出生図で体験できます。Windows / macOS対応で、購入やアカウント登録は不要です。",
      download: "無料Museum＋Dream Skyをダウンロード",
      close: "デモに戻る",
      note: "このデモがあなたの出生データを求めることはありません。無料版アプリで使うYAMLは他人へ共有しないでください。"
    }
  };

  function lang() {
    return document.documentElement.lang === "ja" ? "ja" : "en";
  }

  function applyDemoI18n() {
    var s = STR[lang()];
    var set = function (id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = text;
    };
    set("ht-demo-ribbon-text", s.ribbon);
    set("ht-demo-cta", s.cta);
    set("ht-demo-title", s.title);
    set("ht-demo-copy1", s.copy1);
    set("ht-demo-copy2", s.copy2);
    set("ht-demo-note", s.note);
    renderActions(s);
  }

  function renderActions(s) {
    var box = document.getElementById("ht-demo-actions");
    if (!box) return;
    box.innerHTML = "";
    var mk = function (href, label, primary) {
      var a = document.createElement("a");
      a.className = primary ? "ht-btn" : "ht-btn ht-btn-secondary";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = label;
      box.appendChild(a);
    };
    mk("/downloads/birth-chart-museum-free.zip?lang=" + lang(), s.download, true);
    var close = document.createElement("button");
    close.type = "button";
    close.className = "ht-btn ht-btn-secondary";
    close.textContent = s.close;
    close.addEventListener("click", function () {
      var ov = document.getElementById("ht-demo-overlay");
      if (ov) ov.hidden = true;
    });
    box.appendChild(close);
  }

  // 版間リンクをデモ用ルートに付け替え（デモの外に出ない導線にする）
  function rewriteLinks() {
    var map = {
      "/house-tour": "/birth-chart-museum/demo",
      "/house-tour-architecture": "/birth-chart-museum/demo/architecture",
      "/birth-chart-museum": "/birth-chart-museum/demo",
      // 書き換え済みリンクも言語切替のたびに ?lang を更新する
      "/birth-chart-museum/demo": "/birth-chart-museum/demo",
      "/birth-chart-museum/demo/architecture": "/birth-chart-museum/demo/architecture"
    };
    document.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      var path = href.split("?")[0];
      if (map[path]) {
        a.setAttribute("href", map[path] + "?lang=" + lang());
      }
    });
    // 「出生図の切替はミュージアム入口で」はデモでは案内しない
    document.querySelectorAll('[data-i18n="hint_3"]').forEach(function (el) {
      el.style.display = "none";
    });
  }

  var cta = document.getElementById("ht-demo-cta");
  if (cta) {
    cta.addEventListener("click", function () {
      var ov = document.getElementById("ht-demo-overlay");
      if (ov) ov.hidden = false;
    });
  }

  new MutationObserver(function () {
    applyDemoI18n();
    rewriteLinks();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });

  applyDemoI18n();
  rewriteLinks();
})();
</script>
