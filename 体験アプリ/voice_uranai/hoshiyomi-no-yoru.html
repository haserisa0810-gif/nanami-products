/* ============ YAML分離 ============ */
function extractYaml(text) {
  const fence = text.match(/```ya?ml\s*\n([\s\S]*?)```/);
  if (fence) return fence[1].trim();
  const m = text.match(/^version:/m);
  if (m) return text.slice(m.index).trim();
  return text.trim();
}

  Aqu:"独自の視点を持ち、先を見通す力がある", Pis:"境界を超えた共感力と、豊かな想像力がある",
};
const SIGN_JA = { Ari:"牡羊座",Tau:"牡牛座",Gem:"双子座",Can:"蟹座",Leo:"獅子座",Vir:"乙女座",Lib:"天秤座",Sco:"蠍座",Sag:"射手座",Cap:"山羊座",Aqu:"水瓶座",Pis:"魚座" };
const ASPECT_WORD = { conjunction:"と重なる",opposition:"と向き合う",square:"と緊張する",trine:"と調和する",sextile:"と連携する" };
const BODY_JA = { Sun:"太陽",Moon:"月",Mercury:"水星",Venus:"金星",Mars:"火星",Jupiter:"木星",Saturn:"土星",Uranus:"天王星",Neptune:"海王星",Pluto:"冥王星" };
const HINT_COMMENT = {
  "行動力、活用":"動きが出やすい流れだよ。思い切って前に進む日にできるね。",
  "変化対応、調整":"変化が表れやすい時期。焦らず、違和感を確かめながら進めて。",
  "責任と整理、活用":"整理や仕込みに向いてる。地道な作業が後から効いてくるよ。",
  "思考整理、調整":"頭が回りやすい一方で、考えすぎに注意。まず書き出してみて。",
  "思考整理、活用":"言葉にしやすい時期。アイデアを外に出すのに向いてるよ。",
  "対人調整、活用":"誰かと話すと動きやすくなる日。相談や連絡を前に進めて。",
  "自己表現、調整":"自分を出したい気持ちが高まる。受け取られ方を少し確かめてね。",
  "自己表現、活用":"表現や発信に向いてる。温めてたことを出してみて。",
  "感情調整、調整":"感情が揺れやすい。決断より、ただ感じておくだけでいい日かも。",
  "感情調整、活用":"気持ちが動きやすく、共感力が高まる日だよ。",
};
function sliceBetween(text, s, e) {
  const i = text.indexOf(s); if (i < 0) return "";
  const rest = text.slice(i + s.length); const j = e ? rest.indexOf(e) : -1;
  return j >= 0 ? rest.slice(0, j) : rest;
}
function buildLocalReading(yamlStr) {
  const natalSlice = sliceBetween(yamlStr, "natal:", "houses:");
  if (!natalSlice) return null;
  const bodies = {};
  const bodyRe = /^ +([A-Za-z][A-Za-z ]*):\s*\n +sign: (\w+)[\s\S]*?\n +house: (\d+)/gm;
  let bm;
  while ((bm = bodyRe.exec(natalSlice)) !== null) bodies[bm[1].trim()] = { sign: bm[2], house: parseInt(bm[3],10) };
  if (!bodies.Sun) return null;

  const lines = [];
  const sun = bodies.Sun;
  lines.push("……いらっしゃい。" + (SIGN_JA[sun.sign]||"") + "の太陽を持つあなたの星が、水晶に映り始めたよ。");
  lines.push((SIGN_JA[sun.sign]||"") + "の太陽は第" + sun.house + "ハウス。あなたの核には「" + (SIGN_COMMENT[sun.sign]||"") + "」という傾向があるね。");
  if (bodies.Moon) {
    const mo = bodies.Moon;
    lines.push("月は" + (SIGN_JA[mo.sign]||"") + "の第" + mo.house + "ハウスにいる。感情の動き方には「" + (SIGN_COMMENT[mo.sign]||"") + "」という質があるみたい。");
  }
  const counts = {};
  ["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto"].forEach(n=>{ if(bodies[n]) counts[bodies[n].house]=(counts[bodies[n].house]||0)+1; });
  const busy = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if (busy && busy[1] >= 3) lines.push("第" + busy[0] + "ハウスに" + busy[1] + "つの天体が集まってる。ここでの経験が、あなたの人生でとても大きな意味を持つよ。");

  const aspSlice = sliceBetween(yamlStr, "aspects:", "summary:");
  const aspRe = /- body1: ([\w ]+)\n +body2: ([\w ]+)\n +aspect: (\w+)\n +orb: ([\d.]+)/g;
  let am, picked = null;
  while ((am = aspRe.exec(aspSlice)) !== null) { if (parseFloat(am[4]) < 1.0 && BODY_JA[am[1].trim()] && BODY_JA[am[2].trim()]) { picked = am; break; } }
  if (picked) lines.push(BODY_JA[picked[1].trim()] + "が" + BODY_JA[picked[2].trim()] + (ASPECT_WORD[picked[3]]||"と関わる") + "配置——このふたつのテーマは、あなたの中でずっと対話し続けているみたい。");

  const todaySlice = sliceBetween(yamlStr, "today:", "next_31_days_summary:");
  if (todaySlice) {
    const tm = todaySlice.match(/- transit_body: (\w+)\n +natal_body: (\w+)\n +aspect: (\w+)\n +orb: ([\d.]+)/);
    if (tm) lines.push("今日は、空の" + (BODY_JA[tm[1]]||tm[1]) + "があなたの生まれ持つ" + (BODY_JA[tm[2]]||tm[2]) + (ASPECT_WORD[tm[3]]||"と関わる") + "位置にいるよ。外からの刺激が内側に響きやすい一日ね。");
    const theme = yamlStr.match(/overall_theme: (.+)/);
    if (theme) lines.push("この時期全体には、こんな流れがあるみたい——「" + theme[1].trim() + "」");
    const selDate = (todaySlice.match(/selected_date: '([\d-]+)'/) || [])[1] || "";
    const nfdSlice = sliceBetween(yamlStr, "next_few_days:", "action_hints:");
    const nfdRe = /- date: '([\d-]+)'\n +theme: (.+)/g; let nm;
    while ((nm = nfdRe.exec(nfdSlice)) !== null) {
      if (!selDate || nm[1] >= selDate) { const th = nm[2].trim(); lines.push(nm[1] + "ごろは「" + th + "」の気配。" + (HINT_COMMENT[th]||"")); break; }
    }
  }
  if (/transit_long_term:\s*\n/.test(yamlStr)) {
    const ltSlice = sliceBetween(yamlStr, "transit_long_term:", "shichusuimei:");
    const ltRe = /- transit_body: (\w+)\n +natal_body: (\w+)\n +aspect: (\w+)\n +peak_date: '([\d-]+)'[\s\S]*?interpretation_hint: (.+)/g;
    let lm, c = 0;
    while ((lm = ltRe.exec(ltSlice)) !== null && c < 2) { lines.push(lm[4] + "ごろ、" + (BODY_JA[lm[1]]||lm[1]) + "があなたの" + (BODY_JA[lm[2]]||lm[2]) + "に働きかける時期。" + lm[5].trim() + "よ。"); c++; }
  }
  lines.push("……星は急かさない。あなたのペースで、ゆっくり受け取ってね。");
  return lines;
}

/* ============ 星空生成 ============ */
(function(){
  const scene = document.getElementById("scene");
  for (let i=0;i<60;i++){
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = (Math.random()*100)+"%";
    s.style.top = (Math.random()*60)+"%";
    const size = Math.random()*2.4+0.8;
    s.style.width = size+"px"; s.style.height = size+"px";
    s.style.setProperty("--d",(Math.random()*3+2).toFixed(1)+"s");
    s.style.setProperty("--dl",(Math.random()*4).toFixed(1)+"s");
    scene.insertBefore(s, scene.firstChild);
  }
})();

/* ============ 声レイヤー（VOICEVOX:東北イタコ） ============
   VNの上に乗る任意レイヤー。剥がしても元のVNは動く。
   接続点は typeWrite() 内の voice.speak(text) のみ。 */
const voiceBase = "";   // 同一オリジン配信ならこのまま。別ポートなら "http://localhost:5000"
// CPU版ENGINEは1文の合成に十数秒かかるため、文単位に分割して逐次合成・逐次再生する。
// ENGINEへのリクエストは常に同時1本（過負荷で504になるのを防ぐ）。
const voice = {
  ready: false,    // /health 到達済みか
  on: false,       // ユーザーのトグル状態
  cache: new Map(),   // 文 → objectURL（同一文は再合成しない）
  audio: null,
  gen: 0,          // セリフ世代。古い世代の文は再生しない（キャッシュには残す）
  jobs: [],        // 合成待ち [{sent, gen}]  gen<0 は先読み（再生しない）
  playQueue: [],   // 再生待ちの objectURL（現世代・文順）
  fetching: false,
  playing: false,
  btn: null,
  clean(text) {
    return (text || "").replace(/[✦▸▼★☆♪]/g, " ").replace(/\s+/g, " ").trim();
  },
  split(text) {
    return this.clean(text).split(/(?<=[。！？!?])\s*/).map(s => s.trim()).filter(Boolean);
  },
  updateBtn() {
    if (!this.btn || !this.ready) return;
    if (!this.on) { this.btn.textContent = "🔇 声をきく"; return; }
    this.btn.textContent = this.fetching ? "🔊 声：ON（紡ぎ中…）" : "🔊 声：ON";
  },
  async probe() {
    this.btn = document.getElementById("voiceToggle");
    this.btn.onclick = (e) => { e.stopPropagation(); this.toggle(); };
    try {
      const res = await fetch(voiceBase + "/health");
      const j = await res.json();
      if (!res.ok || !j.ok) throw new Error("voice not ready");
      this.ready = true;
      this.btn.disabled = false;
      this.updateBtn();
    } catch {
      this.ready = false;
      this.btn.disabled = true;
      this.btn.textContent = "声を準備中…";
    }
  },
  toggle() {
    if (!this.ready) return;
    this.on = !this.on;
    if (!this.on) { this.stop(); this.jobs = []; }
    else {
      // クリック（ユーザー操作）の中で一度鳴らして自動再生制限を解除しておく
      new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play().catch(() => {});
      this.speak(fullText);  // 表示中のセリフから読み上げ開始
    }
    this.updateBtn();
  },
  stop() {
    this.gen++;
    this.playQueue = [];
    if (this.audio) { this.audio.pause(); this.audio = null; }
    this.playing = false;
  },
  speak(text) {
    if (!this.on || !this.ready) return;
    this.stop();
    const sents = this.split(text);
    if (!sents.length) return;
    // 前のセリフの合成待ちは捨てて、今のセリフを最優先にする（合成中の1本だけは完走させてキャッシュする）
    this.jobs = sents.map(s => ({ sent: s, gen: this.gen }));
    this.pump();
  },
  async pump() {
    if (this.fetching) return;
    const job = this.jobs.shift();
    if (!job) { this.updateBtn(); return; }
    this.fetching = true;
    this.updateBtn();
    try {
      let url = this.cache.get(job.sent);
      if (!url) {
        const res = await fetch(voiceBase + "/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: job.sent }),
        });
        if (res.ok) {
          url = URL.createObjectURL(await res.blob());
          this.cache.set(job.sent, url);
        }
      }
      if (url && job.gen === this.gen && this.on) {
        this.playQueue.push(url);
        this.drain();
      }
    } catch { /* ENGINE停止等は無音フォールバック。VN進行は止めない */ }
    this.fetching = false;
    this.updateBtn();
    this.pump();
  },
  drain() {
    if (this.playing || !this.on) return;
    const url = this.playQueue.shift();
    if (!url) return;
    this.playing = true;
    this.audio = new Audio(url);
    this.audio.onended = () => { this.playing = false; this.audio = null; this.drain(); };
    this.audio.onerror = () => { this.playing = false; this.audio = null; this.drain(); };
    this.audio.play().catch(() => { this.playing = false; });
  },
};

/* ============ タイプライター ============ */
let typeTimer = null, typeDone = false, fullText = "";
function typeWrite(text, cb) {
  clearInterval(typeTimer);
  voice.speak(text);
  fullText = text; typeDone = false;
  const el = document.getElementById("dialogText");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !text) { el.textContent = text; typeDone = true; if(cb)cb(); return; }
  let i = 0; el.textContent = "";
  const speed = text.length > 200 ? 14 : 28;  // 長文（鑑定一括表示）は倍速で流す
  typeTimer = setInterval(()=>{
    i++; el.textContent = text.slice(0,i);
    el.scrollTop = el.scrollHeight;  // あふれたら追従スクロール
    if (i >= text.length) { clearInterval(typeTimer); typeDone = true; if(cb)cb(); }
  }, speed);
}
function skipType() { clearInterval(typeTimer); document.getElementById("dialogText").textContent = fullText; typeDone = true; }

/* ============ 状態管理 ============ */
let mode = "intro";
let chunks = [], chunkIdx = 0, pureYaml = "";

const els = {
  tapHint: document.getElementById("tapHint"),
  advance: document.getElementById("advance"),
  pg: document.getElementById("pg"),
  chooseRow: document.getElementById("chooseRow"),
  inputBox: document.getElementById("inputBox"),
  personaInputBox: document.getElementById("personaInputBox"),
  offerRow: document.getElementById("offerRow"),
  personaBox: document.getElementById("personaBox"),
  dialog: document.getElementById("dialog"),
  yamlR: document.getElementById("yamlR"),
  yamlP: document.getElementById("yamlP"),
  copyArea: document.getElementById("copyArea"),
};
function hideAll() {
  ["tapHint","advance","pg","chooseRow","inputBox","personaInputBox","offerRow","personaBox"].forEach(k=>els[k].classList.add("hidden"));
}

const LINES = {
  intro: "いらっしゃい。星詠みの夜へ、ようこそ。\nわたしはナナミ。あなたの星を視るね。",
  choose: "今夜はどちらにする？\n星を視る？　それとも、あなたの分身を作る？",
  input: "じゃあ、その巻物をここに置いてね。",
  persona_input: "分身を紡ぐには、星のデータが要るよ。\nここに置いてね。",
  offer: "ねえ、ひとつ提案があるの。\nあなたの星から「分身」も写し取れるよ。どこのAIにも連れて行ける巻物にするの。作ってみる？",
  persona: "できたよ。この巻物をぜんぶ写して、好きなAIに渡してね。\nあなたの星を持った分身が、話し始めるはずだよ。",
};

function render(extraLine) {
  hideAll();
  // 鑑定は全行を一括表示し、声はそのまま頭から連続読み上げする
  const line = extraLine || LINES[mode] || (mode==="reading" ? chunks.join("\n") : "");
  const tappable = (mode === "intro" || mode === "reading");
  typeWrite(line, ()=>{
    if (tappable) els.advance.classList.remove("hidden");
    if (mode === "choose") els.chooseRow.classList.remove("hidden");
    else if (mode === "input") els.inputBox.classList.remove("hidden");
    else if (mode === "persona_input") els.personaInputBox.classList.remove("hidden");
    else if (mode === "offer") els.offerRow.classList.remove("hidden");
    else if (mode === "persona") els.personaBox.classList.remove("hidden");
  });
  if (tappable) els.tapHint.classList.remove("hidden");
}

/* ============ 進行 ============ */
function advance() {
  if (!typeDone) { skipType(); if(mode==="intro"||mode==="reading") els.advance.classList.remove("hidden"); return; }
  if (mode === "intro") { mode = "choose"; render(); }
  else if (mode === "reading") { mode = "offer"; render(); }
}
els.dialog.addEventListener("click", ()=>{ if (mode==="intro"||mode==="reading") advance(); });

/* ============ ボタン ============ */
document.getElementById("btnReadChoose").onclick = (e)=>{ e.stopPropagation(); mode="input"; els.yamlR.value=""; render(); };
document.getElementById("btnPersonaChoose").onclick = (e)=>{ e.stopPropagation(); mode="persona_input"; els.yamlP.value=""; render(); };
document.getElementById("btnBackR").onclick = (e)=>{ e.stopPropagation(); mode="choose"; render(); };
document.getElementById("btnBackP").onclick = (e)=>{ e.stopPropagation(); mode="choose"; render(); };

document.getElementById("btnDoReading").onclick = (e)=>{
  e.stopPropagation();
  const raw = extractYaml(els.yamlR.value);
  if (!raw.trim()) return;
  pureYaml = raw;
  const lines = buildLocalReading(raw);
  if (!lines) { render("んん……このデータ、星のかたちが読めないみたい。\nもう一度確かめてみてね。"); els.inputBox.classList.remove("hidden"); return; }
  chunks = lines; chunkIdx = 0; mode = "reading"; render();
};
document.getElementById("btnDoPersona").onclick = (e)=>{
  e.stopPropagation();
  const raw = extractYaml(els.yamlP.value);
  if (!raw.trim()) return;
  pureYaml = raw;
  els.copyArea.value = PERSONA_TEMPLATE + pureYaml;
  mode = "persona"; render();
};
document.getElementById("btnOfferPersona").onclick = (e)=>{ e.stopPropagation(); els.copyArea.value = PERSONA_TEMPLATE + pureYaml; mode="persona"; render(); };
document.getElementById("btnOfferBack").onclick = (e)=>{ e.stopPropagation(); resetAll(); };
document.getElementById("btnPersonaBack").onclick = (e)=>{ e.stopPropagation(); resetAll(); };

document.getElementById("btnCopy").onclick = async (e)=>{
  e.stopPropagation();
  const btn = e.target;
  try { await navigator.clipboard.writeText(els.copyArea.value); }
  catch { els.copyArea.select(); document.execCommand("copy"); }
  btn.textContent = "写し取ったよ ✦";
  setTimeout(()=>{ btn.textContent = "巻物を写し取る"; }, 2000);
};

function resetAll() { mode="choose"; els.yamlR.value=""; els.yamlP.value=""; chunks=[]; chunkIdx=0; render(); }

/* ============ 起動 ============ */
voice.probe();
render();
</script>
