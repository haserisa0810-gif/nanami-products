<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口寄せ｜東北イタコ ボイス占い</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #0b1220;   /* 夜の底 */
      --ink-2:      #141d33;   /* 藍鉄 */
      --paper:      #e9e4d6;   /* 生成りの和紙 */
      --paper-dim:  #b7b1a3;   /* かすれた墨字 */
      --gold:       #c9a24a;   /* 蝋燭・鈴の金 */
      --gold-soft:  #e6c877;
      --vermil:     #9e3b32;   /* 朱・印肉 */
      --line:       rgba(201,162,74,.28);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
      color: var(--paper);
      background:
        radial-gradient(1200px 600px at 50% -10%, #1c2745 0%, transparent 60%),
        radial-gradient(800px 500px at 85% 110%, #221a2e 0%, transparent 55%),
        linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 2rem;
    }

    /* 立ちのぼる香煙のようなヘッダ */
    .altar {
      width: 100%;
      max-width: 620px;
      text-align: center;
      position: relative;
    }

    .eyebrow {
      font-family: "Shippori Mincho", serif;
      letter-spacing: .5em;
      font-size: .7rem;
      color: var(--gold);
      text-indent: .5em;
      margin: 0 0 1.1rem;
      opacity: .85;
    }

    h1 {
      font-family: "Shippori Mincho", serif;
      font-weight: 800;
      font-size: clamp(2.1rem, 7vw, 3.1rem);
      letter-spacing: .12em;
      margin: 0;
      line-height: 1.25;
      color: var(--paper);
      text-shadow: 0 0 24px rgba(201,162,74,.18);
    }

    h1 .kuchiyose {
      display: block;
      font-size: .9em;
    }

    h1 .sub {
      display: block;
      font-size: .38em;
      letter-spacing: .34em;
      color: var(--gold-soft);
      margin-top: .9rem;
      font-weight: 600;
      text-indent: .34em;
    }

    /* 鈴緒のような金の縦線 */
    .thread {
      width: 1px;
      height: 46px;
      margin: 1.4rem auto .2rem;
      background: linear-gradient(var(--gold), transparent);
    }
    .bead {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--gold);
      margin: 0 auto 1.8rem;
      box-shadow: 0 0 12px var(--gold-soft);
    }

    /* 御神鏡 — 円窓のバストアップ */
    .kagami {
      --size: 190px;
      width: var(--size);
      height: var(--size);
      margin: 0 auto 1.5rem;
      position: relative;
      border-radius: 50%;
      display: grid;
      place-items: center;
      /* 金の輪 */
      background:
        radial-gradient(circle at 50% 42%, rgba(230,200,119,.14), transparent 62%),
        linear-gradient(180deg, #1a2340, #0d1424);
      box-shadow:
        0 0 0 1px rgba(201,162,74,.5),
        0 0 0 7px rgba(11,18,32,.9),
        0 0 0 8px rgba(201,162,74,.35),
        0 0 40px -6px rgba(201,162,74,.35),
        0 24px 50px -24px rgba(0,0,0,.8);
      overflow: hidden;
    }
    .kagami::after {
      /* 鏡面の淡い光 */
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(150deg, rgba(233,228,214,.14), transparent 45%);
      pointer-events: none;
    }
    .kagami img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 絵が未設定のときのプレースホルダ文字 */
    .kagami .placeholder {
      font-family: "Shippori Mincho", serif;
      color: var(--paper-dim);
      font-size: .72rem;
      letter-spacing: .22em;
      text-align: center;
      line-height: 1.9;
      padding: 0 1rem;
      text-indent: .22em;
    }
    /* 口寄せ中は鏡がゆらぐ */
    .kagami.busy {
      animation: kagami-glow 1.6s ease-in-out infinite;
    }
    @keyframes kagami-glow {
      0%,100% { box-shadow:
        0 0 0 1px rgba(201,162,74,.5),
        0 0 0 7px rgba(11,18,32,.9),
        0 0 0 8px rgba(201,162,74,.35),
        0 0 40px -6px rgba(201,162,74,.35),
        0 24px 50px -24px rgba(0,0,0,.8); }
      50% { box-shadow:
        0 0 0 1px rgba(230,200,119,.8),
        0 0 0 7px rgba(11,18,32,.9),
        0 0 0 8px rgba(230,200,119,.6),
        0 0 60px 2px rgba(230,200,119,.55),
        0 24px 50px -24px rgba(0,0,0,.8); }
    }

    .lead {
      font-family: "Shippori Mincho", serif;
      color: var(--paper-dim);
      font-size: .95rem;
      letter-spacing: .06em;
      margin: 0 0 1.6rem;
      line-height: 1.9;
    }

    /* 和紙の札 */
    .fuda {
      width: 100%;
      max-width: 620px;
      background:
        linear-gradient(180deg, rgba(233,228,214,.04), rgba(233,228,214,.02));
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1.4rem;
      backdrop-filter: blur(2px);
      box-shadow:
        0 1px 0 rgba(201,162,74,.12) inset,
        0 30px 60px -30px rgba(0,0,0,.7);
    }

    label.field-label {
      display: block;
      font-family: "Shippori Mincho", serif;
      font-size: .8rem;
      letter-spacing: .28em;
      color: var(--gold);
      margin-bottom: .7rem;
      text-indent: .28em;
    }

    textarea {
      width: 100%;
      height: 190px;
      resize: vertical;
      background: rgba(11,18,32,.55);
      color: var(--paper);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: .9rem 1rem;
      font-family: "Shippori Mincho", serif;
      font-size: 1rem;
      line-height: 1.85;
      letter-spacing: .04em;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }
    textarea::placeholder { color: rgba(183,177,163,.45); }
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,162,74,.12);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.1rem;
      flex-wrap: wrap;
    }

    /* 朱印のような発話ボタン */
    button#speakBtn, button#fullBtn {
      font-family: "Shippori Mincho", serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: .3em;
      text-indent: .3em;
      color: var(--paper);
      background: linear-gradient(180deg, var(--vermil), #7d2c25);
      border: 1px solid rgba(201,162,74,.5);
      border-radius: 3px;
      padding: .75rem 2rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .25s, filter .25s;
      box-shadow: 0 8px 22px -10px rgba(158,59,50,.8);
    }
    button#speakBtn:hover:not(:disabled), button#fullBtn:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 10px 26px -8px rgba(201,162,74,.5);
    }
    button#speakBtn:active:not(:disabled), button#fullBtn:active:not(:disabled) { transform: translateY(1px); }
    button#speakBtn:disabled, button#fullBtn:disabled { opacity: .5; cursor: default; }
    button#speakBtn:focus-visible, button#fullBtn:focus-visible {
      outline: 2px solid var(--gold-soft);
      outline-offset: 3px;
    }

    /* 鎮め・文送りの控えボタン */
    button.ghost {
      font-family: "Shippori Mincho", serif;
      font-weight: 600;
      font-size: .92rem;
      letter-spacing: .2em;
      text-indent: .2em;
      color: var(--gold-soft);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: .75rem 1.3rem;
      cursor: pointer;
      transition: border-color .25s, color .25s;
    }
    button.ghost:hover { border-color: var(--gold); color: var(--paper); }
    button.ghost:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

    textarea.ta-summary { height: 120px; }
    .field-gap { margin-top: 1.3rem; }

    /* フル版：読み上げ中の文を映す帳 */
    #reader {
      margin-top: 1.2rem;
      padding: 1rem 1.1rem;
      background: rgba(11,18,32,.55);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-family: "Shippori Mincho", serif;
      font-size: .98rem;
      line-height: 2.05;
      letter-spacing: .04em;
      color: var(--paper-dim);
      max-height: 40vh;
      overflow-y: auto;
      user-select: text;
    }
    #reader .sent { transition: color .3s, background .3s; padding: 0 .12em; border-radius: 2px; }
    #reader .sent.now {
      color: var(--gold-soft);
      background: rgba(201,162,74,.13);
      text-shadow: 0 0 12px rgba(230,200,119,.35);
    }
    #reader .sent.done { color: var(--paper); opacity: .8; }
    #reader .sent.skip { text-decoration: line-through; opacity: .4; }

    #status {
      font-family: "Shippori Mincho", serif;
      color: var(--gold-soft);
      font-size: .85rem;
      letter-spacing: .1em;
      min-height: 1.4em;
    }
    #status.err { color: #e08b83; }

    /* 合成中の点滅する灯 */
    #status.busy::before {
      content: "";
      display: inline-block;
      width: 7px; height: 7px;
      margin-right: .55em;
      border-radius: 50%;
      background: var(--gold-soft);
      box-shadow: 0 0 8px var(--gold-soft);
      animation: flicker 1.1s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes flicker {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: .25; transform: scale(.7); }
    }

    audio {
      width: 100%;
      margin-top: 1.2rem;
      filter: sepia(.15) saturate(.9);
    }

    #credit {
      max-width: 620px;
      width: 100%;
      margin-top: 2.4rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--line);
      color: var(--paper-dim);
      font-size: .78rem;
      letter-spacing: .12em;
      text-align: center;
      font-family: "Shippori Mincho", serif;
    }
    #credit .seal {
      color: var(--gold);
    }

    @media (prefers-reduced-motion: reduce) {
      #status.busy::before { animation: none; }
    }
  </style>
</head>
<body>
  <header class="altar">
    <p class="eyebrow">口 寄 せ の 座</p>
    <h1>
      <span class="kuchiyose">言の葉を、声に</span>
      <span class="sub">東 北 イ タ コ ボ イ ス 占 い</span>
    </h1>
    <div class="thread"></div>
    <div class="bead"></div>

    <!-- 御神鏡：さばめの立ち絵ができたら下の <div class="placeholder"> を
         <img src="sabame.png" alt="さばめ"> に差し替えるだけ -->
    <div class="kagami" id="kagami">
      <div class="placeholder">こ こ に<br>口 寄 せ 手 の 姿</div>
    </div>

    <p class="lead">鑑定の言葉を札に写し、イタコに口寄せを乞う。<br>要約はひと息に、フル鑑定は一文ずつ、声が降ります。</p>
  </header>

  <main class="fuda">
    <label class="field-label" for="textSummary">要 約 の 札（二百〜三百字・さっと聴く）</label>
    <textarea id="textSummary" class="ta-summary" placeholder="ここに要約鑑定（200〜300字）を貼り付け"></textarea>

    <label class="field-label field-gap" for="textFull">フ ル 鑑 定 の 札（じっくり聴く）</label>
    <textarea id="textFull" placeholder="ここにフル鑑定の全文を貼り付け"></textarea>

    <div class="row">
      <button id="speakBtn" disabled>要約を聴く</button>
      <button id="fullBtn" disabled>フルを聴く</button>
      <button id="stopBtn" class="ghost" hidden>鎮める（停止）</button>
      <button id="nextBtn" class="ghost" hidden>次の文へ</button>
      <div id="status">イタコを呼んでいます…</div>
    </div>
    <div id="reader" hidden></div>
  </main>

  <div id="credit"><span class="seal">VOICEVOX:東北イタコ</span></div>

  <script>
    const speakBtn = document.getElementById('speakBtn');
    const fullBtn  = document.getElementById('fullBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const nextBtn  = document.getElementById('nextBtn');
    const status   = document.getElementById('status');
    const kagami   = document.getElementById('kagami');
    const reader   = document.getElementById('reader');
    const taSummary = document.getElementById('textSummary');
    const taFull    = document.getElementById('textFull');

    function setStatus(msg, kind) {
      status.textContent = msg;
      status.className = kind || '';
      kagami.classList.toggle('busy', kind === 'busy');
    }

    /* ---- ENGINE到達確認。落ちていたらボタン無効化（クラッシュしない） ---- */
    let itakoReady = false;
    async function probe() {
      try {
        const res = await fetch('/health');
        const j = await res.json();
        if (!res.ok || !j.ok) throw new Error();
        itakoReady = true;
        speakBtn.disabled = false;
        fullBtn.disabled = false;
        if (!fullPlayer.playing) setStatus('', '');
      } catch {
        itakoReady = false;
        speakBtn.disabled = true;
        fullBtn.disabled = true;
        setStatus('イタコが降りていません（VOICEVOX未起動）', 'err');
        setTimeout(probe, 20000);  // 起動を待って再確認
      }
    }

    /* ---- 文分割・合成キャッシュ ---- */
    function clean(t) {
      return (t || '').replace(/[✦▸▼★☆♪]/g, ' ').replace(/[ \t]+/g, ' ').trim();
    }
    function splitSentences(text) {
      return clean(text)
        .split(/(?<=[。！？!?])|\n/)
        .map(s => s.trim())
        .filter(Boolean)
        .flatMap(s => s.length > 120   // 長すぎる文は読点で二次分割（合成時間を安定させる）
          ? s.split(/(?<=、)/).map(t => t.trim()).filter(Boolean)
          : [s]);
    }
    const cache = new Map();   // 文 → objectURL（同一文は再合成しない）
    async function fetchAudio(sentence) {
      let url = cache.get(sentence);
      if (url) return url;
      const res = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: sentence })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      url = URL.createObjectURL(await res.blob());
      cache.set(sentence, url);
      return url;
    }

    /* ---- 再生（停止・文送りで途中解決できるPromise） ---- */
    let current = null, currentResolve = null;
    function playUrl(url) {
      return new Promise((resolve) => {
        const a = new Audio(url);
        current = a; currentResolve = resolve;
        const done = () => { if (current === a) { current = null; currentResolve = null; } resolve(); };
        a.onended = done;
        a.onerror = done;
        a.play().catch(done);
      });
    }
    function skipCurrent() {
      const r = currentResolve;
      if (current) current.pause();
      current = null; currentResolve = null;
      if (r) r();
    }

    /* ---- フル版：順次合成・順次再生（先読み1文） ---- */
    function renderReader(sents) {
      reader.innerHTML = '';
      sents.forEach(s => {
        const sp = document.createElement('span');
        sp.className = 'sent';
        sp.textContent = s;
        reader.appendChild(sp);
      });
      reader.hidden = false;
    }
    function markSentence(i, cls) {
      const el = reader.children[i];
      if (el) el.classList.add(cls);
    }
    function highlightSentence(i) {
      [...reader.children].forEach((el, j) => el.classList.toggle('now', j === i));
      const el = reader.children[i];
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    function setPlayingUI(on) {
      speakBtn.disabled = on || !itakoReady;
      fullBtn.disabled = on || !itakoReady;
      stopBtn.hidden = !on;
      nextBtn.hidden = !on;
    }

    const fullPlayer = {
      queue: [], idx: 0, playing: false, stopped: false, skipped: 0,
      async start(text) {
        this.queue = splitSentences(text);
        if (!this.queue.length) { setStatus('言葉が写されていません', 'err'); return; }
        this.idx = 0; this.stopped = false; this.playing = true; this.skipped = 0;
        renderReader(this.queue);
        setPlayingUI(true);
        this._prefetch(0);
        for (this.idx = 0; this.idx < this.queue.length; this.idx++) {
          if (this.stopped) break;
          highlightSentence(this.idx);
          setStatus('口寄せの最中… ' + (this.idx + 1) + ' / ' + this.queue.length + ' 文', 'busy');
          this._prefetch(this.idx + 1);   // 再生と並行して次の文を先合成
          try {
            const url = await fetchAudio(this.queue[this.idx]);
            if (this.stopped) break;
            await playUrl(url);
            markSentence(this.idx, 'done');
          } catch {
            this.skipped++;               // 合成失敗は飛ばして続行（全体を止めない）
            markSentence(this.idx, 'skip');
            if (this.skipped >= 3 && this.idx >= 2 &&
                reader.children[this.idx - 1].classList.contains('skip') &&
                reader.children[this.idx - 2].classList.contains('skip')) {
              // 3文連続で失敗＝ENGINEが落ちた可能性が高いので中断
              this.stopped = true;
              setStatus('声が途切れました。VOICEVOXの様子を確かめてください', 'err');
              probe();
              break;
            }
          }
        }
        this.playing = false;
        setPlayingUI(false);
        if (!this.stopped) {
          highlightSentence(-1);
          setStatus(this.skipped ? '読み終わりました（' + this.skipped + '文を飛ばしました）' : '読み終わりました', '');
        }
      },
      _prefetch(i) { const s = this.queue[i]; if (s) fetchAudio(s).catch(() => {}); },
      next() { if (this.playing) skipCurrent(); },
      stop() {
        if (!this.playing) return;
        this.stopped = true;
        skipCurrent();
        setStatus('声を鎮めました', '');
      }
    };
    stopBtn.addEventListener('click', () => fullPlayer.stop());
    nextBtn.addEventListener('click', () => fullPlayer.next());

    /* ---- 要約版：フル版と同じ分割再生（一発合成はCPUだと遅すぎるため廃止） ---- */
    speakBtn.addEventListener('click', () => {
      if (fullPlayer.playing) return;
      let text = taSummary.value.trim();
      if (!text) {
        // 要約が空ならフルの先頭3文だけ読むフォールバック
        const head = splitSentences(taFull.value).slice(0, 3);
        if (!head.length) { setStatus('言葉が写されていません', 'err'); return; }
        text = head.join('');
      }
      fullPlayer.start(text);
    });

    /* ---- フル版ボタン ---- */
    fullBtn.addEventListener('click', () => {
      if (fullPlayer.playing) return;
      if (!clean(taFull.value)) { setStatus('フル鑑定の札が空です', 'err'); return; }
      fullPlayer.start(taFull.value);
    });

    probe();
  </script>
</body>
</html>
